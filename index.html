<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Designbook</title>
<link rel="stylesheet" href="app.css">
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="lock" id="lock">
  <form class="lock-box" id="unlock">
    <div class="lock-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/></svg></div>
    <h1>Designbook</h1>
    <p id="lock-text">Loading…</p>
    <input type="password" id="pw" name="password" autocomplete="current-password" placeholder="Password" aria-label="Password" disabled>
    <label class="lock-rem"><input type="checkbox" id="remember"> Remember on this device</label>
    <button type="submit" class="btn primary" id="unlock-btn" disabled>Unlock</button>
    <p class="lock-err" id="lock-err" role="alert" hidden></p>
  </form>
</div>
<div id="app" hidden>
  <aside class="sb" id="sb" aria-label="Sections"></aside>
  <div class="col">
    <header class="topbar" id="topbar"></header>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<section class="peek" id="peek" role="dialog" aria-modal="false" aria-label="Details"></section>
</body>
</html>
